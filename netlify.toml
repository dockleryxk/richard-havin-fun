# Netlify build, redirects, and headers for richard.pizza.
# Redirects and headers apply to every deploy context.

[build]
  publish = "dist/"
  command = "npm run build"

# Lighthouse runs against each deploy and posts scores to the deploy summary
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Serve the home page at / only
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Alias domains and the default Netlify subdomain go to the primary host; /* also matches the bare root
[[redirects]]
  from = "https://richardjeffords.com/*"
  to = "https://www.richard.pizza/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.richardjeffords.com/*"
  to = "https://www.richard.pizza/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://richjeff.com/*"
  to = "https://www.richard.pizza/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.richjeff.com/*"
  to = "https://www.richard.pizza/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://richard.rip/*"
  to = "https://www.richard.pizza/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.richard.rip/*"
  to = "https://www.richard.pizza/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://richard-havin-fun.netlify.app/*"
  to = "https://www.richard.pizza/:splat"
  status = 301
  force = true

# Site-wide security headers; HTML and other files keep Netlify's default revalidating cache policy
[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Media and fonts never change in place, so browsers may reuse them for a year without revalidating;
# rename a file when replacing it
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
