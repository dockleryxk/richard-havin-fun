<head>
  <!-- Document basics -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    // Turn on the pizza intro before first paint, unless the visitor prefers reduced motion
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("pizza")
    }

    // GA4: gtag queues events from the start; gtag.js loads after the page, on the production host only
    window.dataLayer = window.dataLayer || []
    function gtag() { dataLayer.push(arguments) }
    if (location.hostname === "www.richard.pizza") {
      gtag("js", new Date())
      gtag("config", "G-9VGYSVTVXY")
      window.addEventListener("load", function () {
        var script = document.createElement("script")
        script.async = true
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-9VGYSVTVXY"
        document.head.appendChild(script)
      })
    }
  </script>

  <!-- Search Engine -->
  <title>Richard Jeffords</title>
  <meta name="description" content="Richard Jeffords is some guy in East TN">
  <link rel="canonical" href="https://www.richard.pizza/">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Richard Jeffords">
  <meta name="twitter:description" content="Richard Jeffords is some guy in East TN">
  <meta name="twitter:image" content="https://www.richard.pizza/assets/images/header.jpg">

  <script defer src="/js/app.min.js" onerror="document.documentElement.classList.remove(&quot;pizza&quot;)"></script>

<body>
  <!-- Pizza intro: keyboard skip link, full-screen clip, and the full-screen button that advances it -->
  <a href="#main" id="skip-pizza" class="skip-link">Skip to content</a>
  <video id="pizza-animations" muted loop autoplay playsinline disableremoteplayback aria-hidden="true">
  </video>
  <button type="button" id="pizza-button" aria-label="More pizza"></button>

  <!-- Page content, hidden during the intro; the song player sits at the end -->
  <main id="main" class="container" tabindex="-1">
    <p>
      Hello, my name is Richard.
    </p>
    <p>
      Not much to see here, but I hope you enjoy your stay.
    </p>
    <p class="disclaimer">
      I wanted to overengineer a dumb website to mess around with Netlify. See the <a
        href="https://github.com/dockleryxk/richard-havin-fun" target="_blank" rel="noopener">source code for this
        idiocy here</a>.
    </p>
    <audio id="gimme-pizza" preload="none" controls>
      <source src="/assets/audio/gimme-pizzaaaaaa.m4a" type='audio/mp4; codecs="mp4a.40.5"'>
      <source src="/assets/audio/gimme-pizzaaaaaa.mp3" type="audio/mpeg">
    </audio>
  </main>
